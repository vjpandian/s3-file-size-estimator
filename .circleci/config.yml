version: 2.1

parameters:
  run-sync:
    type: boolean
    default: false

commands:
  aws-oidc-auth:
    description: Trade CircleCI's OIDC token for short-lived read-only AWS credentials.
    steps:
      - run:
          name: Assume AWS role via OIDC
          command: bash scripts/assume_aws_role.sh

jobs:
  bucket-size-report:
    docker:
      - image: cimg/aws:2026.07
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::047065097147:role/circleci-s3-dropbox-sync
    steps:
      - checkout
      - aws-oidc-auth
      - run:
          name: Install boto3
          command: pip3 install --user boto3
      - run:
          name: Report S3 bucket sizes
          command: python3 scripts/bucket_size_report.py

  configure-schedule:
    docker:
      - image: cimg/aws:2026.07
    environment:
      CIRCLE_PROJECT_SLUG: << pipeline.project.slug >>
    steps:
      - checkout
      - run:
          name: Install CircleCI CLI
          command: |
            curl -1sLf 'https://packages.circleci.com/public/setup.deb.sh' | sudo -E bash
            sudo apt-get install -y circleci
      - run:
          name: Ensure hourly sync schedule exists
          command: bash scripts/ensure_hourly_schedule.sh

  dropbox-sync:
    docker:
      - image: cimg/aws:2026.07
    environment:
      # The AWS CLI errors with NoRegion unless a default is set; the
      # Dropbox secret and the bucket listing both resolve through this.
      AWS_DEFAULT_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::047065097147:role/circleci-s3-dropbox-sync
    steps:
      - checkout
      - aws-oidc-auth
      - run:
          name: Install rclone
          command: sudo apt-get update && sudo apt-get install -y rclone
      - run:
          name: Sync S3 buckets to Dropbox
          command: bash scripts/dropbox_sync.sh
          no_output_timeout: 3h

workflows:
  main:
    when:
      not: << pipeline.parameters.run-sync >>
    jobs:
      - bucket-size-report
      - configure-schedule:
          context: circleci-api
          # Serialized so two concurrent pipelines can't both see "no schedule"
          # and race to create duplicate triggers.
          serial-group: << pipeline.project.slug >>/configure-schedule

  scheduled-sync:
    when: << pipeline.parameters.run-sync >>
    jobs:
      - dropbox-sync:
          # Only one sync touches Dropbox at a time. Hourly triggers against a
          # run that can last ~4h would otherwise overlap and fight over the
          # same destination paths.
          serial-group: << pipeline.project.slug >>/dropbox-sync
